<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="index.html">
      <span class="mark">Miami-Dade <span class="accent">Commission</span> Watch</span>
      <span class="tagline">BCC · Plain Language</span>
    </a>
    <div class="header-actions">
      <div class="social-icons">
        <a class="social-icon" href="https://instagram.com/miamidadecommissionwatch" target="_blank" rel="noopener" aria-label="Miami-Dade Commission Watch on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg>
        </a>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    </div>
  </div>
  <nav class="site-nav" id="site-nav" aria-label="Primary">

<main id="main">

  <section class="hero" style="padding-bottom:24px;">
    <div class="wrap">
      <span class="eyebrow">Staff</span>
      <h1 style="max-width:20ch;">Admin login</h1>
      <p class="lede">For Miami-Dade Commission Watch administrators only.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <form id="login-form" style="max-width:420px;">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-large">Log in</button>
      </form>

      <div id="login-status" class="district-status" style="margin-top:16px; max-width:420px;"></div>

      <p style="max-width:420px; margin-top:16px;">
        <a href="#" id="forgot-password-link">Forgot your password?</a>
      </p>

      <form id="forgot-password-form" style="max-width:420px; display:none;">
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="email" autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-secondary">Send reset link</button>
      </form>

      <div id="forgot-password-status" class="district-status" style="margin-top:16px; max-width:420px;"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-disclaimer">
      <p style="margin-bottom:0;">&copy; 2026 Miami-Dade Commission Watch.</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/login.js"></script>
</body>
</html>
